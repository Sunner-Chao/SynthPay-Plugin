[watcher]
dry_run = 1
callback_url = https://pay.synthapi.asia/api/pay/REPLACE_CHANNEL_ID/notify
callback_secret = REPLACE_WITH_RANDOM_SECRET
state_dir = %LOCALAPPDATA%\SynthPay\wechat-watcher\state
poll_interval_seconds = 2
http_timeout_seconds = 8
max_attempts = 30
use_system_proxy = 0
observer_mode = auto
tesseract_path = %ProgramFiles%\Tesseract-OCR\tesseract.exe
tessdata_dir = %LOCALAPPDATA%\SynthPay\wechat-watcher\tessdata
background_window = 1
background_x = -10000
background_y = -10000
window_titles = 微信收款助手
